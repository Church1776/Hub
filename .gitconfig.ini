[core]
	######   For Windows   ######
	;sshCommand = ssh
	;editor = 'code' --wait
	;autocrlf = true
	######   For Msys2   ######
	;sshCommand = ssh
	;editor = 'code' --wait
	;autocrlf = true
	;fsmonitor = true
	######   For WSL   ######
	;sshCommand = ssh
	;editor = 'code' --wait
	;autocrlf = input
	######   For Linux   ######
	;sshCommand = ssh
	;editor = ''
	;autocrlf = input
	######   For Mac   ######
	;sshCommand = ssh
	;editor = ''
	;autocrlf = input
	######   For BSD   ######
	;sshCommand = ssh
	;editor = ''
	;autocrlf = input
[credential]
	helper = manager|wincred|oauth|osxkeychain
[user]
	name = First MI Last
	email = myemail@mydomain.any
[alias]
	br = branch
	cc = count
	cf = config
	cfg = config --global
	cfs = config --system
	ck = "!f() { git checkout \"$@\" >/dev/null || return; git status -sbu; git status --show-stash --porcelain=v2 | sed '/stash/!d'; }; f"
	cm = commit -m
	count = "!f() { if [ \"$#\" -eq 0 ]; then echo \"error: no branches provided.\"; return; fi; o=\"$(git remote)\" || return; b=\"$(git branch --show-current)\"; for a in \"$@\"; do if [ \"$b\" = \"$a\" ]; then echo \"error: can't count commits for '$a' against itself.\" && continue; fi; git branch -u \"$a\" >/dev/null 2>&1 || { echo \"error: branch '$a' not found.\" && continue; }; git status -sb; done; git branch -u \"$o/$b\" >/dev/null; }; f"
	df = "!f() { git diff \"${@:-HEAD}\"; }; f"
	drop = restore --staged
	ds = diff --staged
	du = diff
	graph = log --graph --decorate --full-diff --stat --patch
	list = log --oneline --decorate
	mg = merge
	mgff = merge --ff-only
	mod = submodule
	patch = add --patch
	pick = cherry-pick
	pl = pull
	ps = push
	rb = rebase
	rbff = rebase --ff-only
	rs = reset
	st = "!f() { git status -sbu \"$@\" || return; git status --show-stash --porcelain=v2 | sed '/stash/!d'; }; f"
	sw = "!f() { git switch \"$@\" >/dev/null || return; git status -sbu; git status --show-stash --porcelain=v2 | sed '/stash/!d'; }; f"
	unstage = restore --staged
	up = rev-parse --abbrev-ref @{upstream}
[filter "lfs"]
	smudge = git-lfs smudge -- %f
	process = git-lfs filter-process
	required = true
	clean = git-lfs clean -- %f
[init]
	defaultBranch = main
